[build-system]
requires = ["scikit-build-core>=0.5"]
build-backend = "scikit_build_core.build"

[project]
name = "s2-py"
version = "0.11.1"
description = "pip-able S2 Geometry Bindings"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gabe Frangakis" }]
requires-python = ">=3.8"
dependencies = []

[dependency-groups]
dev = ["build", "twine"]

[tool.scikit-build]
wheel.packages = ["lib/s2_py"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
install.components = ["s2_py"]

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"

[tool.cibuildwheel.linux]
archs = "x86_64 aarch64"
before-all = [
    "yum install -y pcre-devel openssl-devel",
    "rm -f /usr/local/bin/swig*",
    "curl -L https://github.com/swig/swig/archive/refs/tags/v3.0.12.tar.gz | tar xz",
    "cd swig-3.0.12 && ./autogen.sh && ./configure --without-alllang --with-python && make -j$(nproc) && make install",
    "curl -L https://github.com/google/googletest/archive/refs/tags/release-1.8.1.tar.gz | tar xz",
    "cd googletest-release-1.8.1/googletest && mkdir build && cd build && cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_FLAGS='-Wno-error=maybe-uninitialized' && make -j$(nproc) && cp -r ../include/gtest /usr/local/include/gtest",
]

[tool.cibuildwheel.macos]
archs = "x86_64 arm64"
before-all = [
    "brew install pcre cmake automake googletest",
    "curl -L https://github.com/swig/swig/archive/refs/tags/v3.0.12.tar.gz | tar xz",
    "cd swig-3.0.12 && ./autogen.sh && ./configure --without-alllang --with-python && make -j$(sysctl -n hw.ncpu) && make install",
]
